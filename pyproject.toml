[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder-ai"
version = "3.0.0"
description = "PATHFINDER AI - Your Friendly Neighborhood Security Scout (Apex Edition)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "PATHFINDER AI Team", email = "security@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
keywords = ["pentesting", "security", "ai", "vulnerability-scanner", "pathfinder", "apex"]

dependencies = [
    # Core
    "click>=8.1.7",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Async
    "aiohttp>=3.9.1",
    "aiodns>=3.1.1",
    "aiofiles>=23.2.1",
    "tenacity>=8.2.3",
    
    # Networking
    "dnspython>=2.4.2",
    "httpx>=0.25.2",
    "python-nmap>=0.7.1",
    
    # AI/ML
    "ollama>=0.1.6",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    
    # Reporting
    "jinja2>=3.1.2",
    "weasyprint>=60.1",
    "markdown>=3.5.1",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.23",
    "aiosqlite>=0.19.0",
    
    # Security
    "cryptography>=41.0.7",
    
    # Logging
    "structlog>=23.2.0",
    
    # Utilities
    "tqdm>=4.66.1",
    "python-dateutil>=2.8.2",
    "validators>=0.22.0",

    # PHANTOM AI - New dependencies
    "networkx>=3.2.1",          # Chain visualization and attack graphs
    "sarif-om>=1.0.4",          # SARIF output for DevSecOps
    "matplotlib>=3.8.2",        # Visualization support
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
    "black>=23.11.0",
    "pre-commit>=3.6.0",
]

# Headless browser for DOM XSS detection and auth flow analysis
# Install with: pip install ai-pentest[browser] && playwright install
browser = [
    "playwright>=1.40.0",
]

# Full installation with all features
full = [
    "playwright>=1.40.0",
]

[project.scripts]
# PATHFINDER AI - Primary entry points 🤖
pathfinder = "cli.pathfinder_cli:main"
pathfinder-ai = "cli.pathfinder_cli:main"
pf = "cli.pathfinder_cli:main"

# Legacy aliases (for backwards compatibility)
phantom = "cli.phantom_cli:main"
phantom-ai = "cli.phantom_cli:main"
pentest = "cli.simple_cli:main"
pentest-legacy = "cli.main:cli"

[project.urls]
Homepage = "https://github.com/example/ai-pentest"
Documentation = "https://ai-pentest.readthedocs.io"

[tool.setuptools.packages.find]
where = ["."]
include = ["pathfinder*", "phantom*", "core*", "reconnaissance*", "scanning*", "ai_engine*", "reporting*", "storage*", "utils*", "cli*", "threat_modeling*", "safe_mode*", "analysis*", "compliance*", "interactive*", "retest*", "validation*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["scanning", "phantom", "utils"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*.bak*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 15
show_missing = true
skip_covered = false

[tool.black]
line-length = 100
target-version = ["py311"]
